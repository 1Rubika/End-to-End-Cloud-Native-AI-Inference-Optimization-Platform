version: '3.8'

services:
  api:
    build: .
    container_name: ml_inference_api
    ports:
      - "8000:8000"
    environment:
      - LABELS_PATH=imagenet_classes.txt
    depends_on:
      - cache
    restart: always

  # Bootstrapping Redis Cache provision layer (Idle until Phase 7 logic uses it)
  cache:
    image: redis:7-alpine
    container_name: ml_inference_cache
    ports:
      - "6379:6379"
    restart: always
